# Example configuration. Place as `concordance.toml` in the analyzed repository, or
# anywhere and pass `--config path/to/file.toml`. Every key is optional; command-line
# flags override it (--repo, --spec-root, --src-root, --state-dir, --semantic, --model,
# --host, --port).

repo = "/path/to/repo"                 # relative paths resolve against this file's directory
spec_roots = ["docs/specifications", "docs/architecture"]
src_roots = ["crates", "src"]
exclude = ["docs/archive/**"]           # globs relative to the repository root
# state_dir = "C:/somewhere/else"       # default: %LOCALAPPDATA%\concordance\<repo>-<hash>

[authority]                              # globs; first matching list wins, in this order
normative = ["docs/specifications/**"]
descriptive = ["README.md", "docs/guides/**"]
informative = ["docs/history/**"]

[lint]                                   # `concordance lint` (docs/spec-lint.md)
whitepaper = "docs/whitepaper.md"
strict = false                           # true: warnings fail the lint too
# vague_words = ["fast", "secure"]       # replaces the built-in banned words
# internal_markers = ["shard"]           # added to the built-in internal-detail words

[semantic]
enabled = true                           # requires the Claude Code CLI on PATH
model = "sonnet"
challenger_model = "opus"
max_concurrent = 2
max_analyses_per_scan = 40
claude_path = "claude"
context = "explore"                      # the model searches the repo read-only; "excerpts" = linked symbols only
max_turns = 20                           # explore: tool-use turns per analysis

[gate]
# started_milestones = [1, 2]            # requirements of other milestones scan as `planned`; omit to gate all

[server]
host = "127.0.0.1"
port = 4173

# Citations of other repositories: `[APP:apps/api/src/catalog.ts:67-132]` in a spec is
# checked against this repository at `cited` (see docs/cli.md, "Citations").
[repos.APP]
path = "../platform"     # a git repository; relative to this file
cited = "27e5fb9"                        # the revision the citations were written against
compare = "origin/main"                  # optional: report drift of the cited text against it
spellings = ["app"]                      # optional: other spellings of the alias
